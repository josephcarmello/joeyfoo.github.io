<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}">
<head>
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  {{ partial "head.html" . }}
</head>
<body>
  {{ if not (and .IsPage (eq .Section "posts")) }}
    {{ partial "header.html" . }}
  {{ end }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
