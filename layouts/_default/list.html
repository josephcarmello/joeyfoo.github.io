{{ define "main" }}
<section>
  <header>
    <h1>{{ .Title }}</h1>
    {{ if .IsSection }}
      <p class="meta"><a class="button" href="{{ "tags/" | relURL }}">tags</a></p>
    {{ end }}
  </header>
  {{ with .Content }}{{ . }}{{ end }}
  <section class="grid posts">
    {{ range .Paginator.Pages }}
      <time class="meta" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 02, 2006" }}</time>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ end }}
  </section>
  {{ partial "pagination.html" . }}
</section>
{{ end }}
